<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080b" />
  <title>صوت — غرف وأصدقاء وألعاب</title>
  <link rel="stylesheet" href="/app.css?v=1" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <!-- تسجيل الدخول -->
  <section class="gate" id="gate" hidden>
    <div class="gate-inner">
      <header class="gate-brand">
        <h1 class="mark">صوت</h1>
        <div class="rule" aria-hidden="true"><span></span></div>
        <p class="tagline">غرف صوتية · أصدقاء · ألعاب</p>
      </header>

      <div class="panel">
        <div class="mode-tabs" id="mode-tabs" role="tablist" aria-label="طريقة الدخول">
          <button type="button" data-mode="login" aria-pressed="true">دخول</button>
          <button type="button" data-mode="signup" aria-pressed="false">حساب جديد</button>
        </div>

        <div class="method-tabs" id="method-tabs" role="group" aria-label="الوسيلة">
          <button type="button" data-method="email" aria-pressed="true">البريد</button>
          <button type="button" data-method="phone" aria-pressed="false">الهاتف</button>
          <button type="button" data-method="guest" aria-pressed="false">ضيف</button>
        </div>

        <form id="auth-form" novalidate autocomplete="on">
          <label class="field" id="row-name" hidden>
            <span class="label">الاسم</span>
            <input id="in-name" type="text" autocomplete="name" placeholder="اسمك كما يظهر للأصدقاء" />
          </label>

          <label class="field" id="row-ident">
            <span class="label" id="ident-label">البريد الإلكتروني</span>
            <input id="in-ident" type="text" autocomplete="username" inputmode="email" placeholder="name@example.com" />
          </label>

          <label class="field" id="row-pass">
            <span class="label">كلمة المرور</span>
            <input id="in-pass" type="password" autocomplete="current-password" placeholder="٦ أحرف على الأقل" />
          </label>

          <p class="hint" id="auth-hint">أدخل بيانات حسابك للمتابعة.</p>
          <p class="error" id="auth-error" role="alert" hidden></p>

          <button class="btn-primary" id="auth-submit" type="submit">دخول</button>
        </form>
      </div>

      <p class="gate-foot">كلمة المرور تُحفظ مشفّرة داخل قاعدة البيانات — لا تُرسل لأي جهة أخرى.</p>
    </div>
  </section>

  <!-- التطبيق بعد الدخول -->
  <div class="shell" id="shell" hidden>
    <header class="app-head">
      <div class="me">
        <span class="me-avatar" id="me-avatar">•</span>
        <span class="me-text">
          <span class="me-hello" id="me-hello">أهلاً بك</span>
          <strong class="me-name" id="me-name">…</strong>
        </span>
      </div>
      <button type="button" class="head-btn" id="btn-refresh">تحديث</button>
    </header>

    <main class="view" id="view"></main>

    <nav class="tabbar" id="tabbar" aria-label="الأقسام الرئيسية">
      <a class="tab" href="#rooms" data-tab="rooms">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9.2A3.2 3.2 0 0 1 7.2 6h9.6A3.2 3.2 0 0 1 20 9.2V20"/><path d="M4 20h16"/><path d="M9.4 12.6a2.6 2.6 0 0 1 5.2 0"/><path d="M12 10.6v.1"/></svg>
        <span>الغرف</span>
      </a>
      <a class="tab" href="#friends" data-tab="friends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.6 19.4a5.4 5.4 0 0 1 10.8 0"/><path d="M16.2 6.4a3 3 0 0 1 0 5.8"/><path d="M17.4 14.4a5 5 0 0 1 3 4.6"/></svg>
        <span>الأصدقاء</span>
      </a>
      <a class="tab" href="#games" data-tab="games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.4"/><circle cx="9" cy="9" r="1.15" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.15" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.15" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.15" fill="currentColor" stroke="none"/></svg>
        <span>الألعاب</span>
      </a>
      <a class="tab" href="#account" data-tab="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.4"/><path d="M5 19.6a7 7 0 0 1 14 0"/></svg>
        <span>حسابي</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app-shell.js?v=1"></script>
</body>
</html>
